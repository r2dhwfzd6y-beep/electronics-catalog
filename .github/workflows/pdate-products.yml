
name: Update products from Google Sheets

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-products:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Download products from Google Sheets
        env:
          SHEET_URL: https://script.google.com/macros/s/AKfycbx-BxvQdI6oWb0GIrx59E1aNSIPSKvfpcZzdXK8PfeV2gFdiWes_KY_LaG-CcowXkuv/exec
        run: |
          curl --fail --location --silent --show-error "$SHEET_URL" -o products.json
          python3 -m json.tool products.json > /dev/null

      - name: Save updated products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json
          if ! git diff --cached --quiet; then
            git commit -m "Update catalog products"
            git push
          fi
